<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Notificación</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
        <td style="padding:24px 28px;border-bottom:1px solid #e4e7eb;font-weight:bold;font-size:18px;">RiTech</td>
    </tr>
    <tr>
        <td style="padding:24px 28px;">
            <h1 style="margin:0 0 12px;font-size:18px;" th:text="${title}">Título</h1>
            <p style="margin:0;line-height:1.5;white-space:pre-line;" th:text="${body}">Contenido</p>
        </td>
    </tr>
    <tr>
        <td style="padding:16px 28px;border-top:1px solid #e4e7eb;font-size:12px;color:#616e7c;">
            Este mensaje es informativo y no constituye asesoría financiera.
            Puedes cambiar tus preferencias de notificación en la aplicación.
        </td>
    </tr>
</table>
</body>
</html>
