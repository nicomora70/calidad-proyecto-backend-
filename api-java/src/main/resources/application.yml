spring:
  application:
    name: ritech-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ritech}
    username: ${DATABASE_USER:ritech}
    password: ${DATABASE_PASSWORD:ritech}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  # Client SMTP. Without MAIL_HOST, e-mail is disabled and only the in-app inbox is used.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  # Trust X-Forwarded-* from the reverse proxy (client IP in the audit log)
  forward-headers-strategy: framework

logging:
  # Plain-text logs (local development) also show the trace id.
  # In Docker, LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs switches to JSON (ECS) logs,
  # which include the "traceId" MDC field automatically.
  pattern:
    level: "%5p [%X{traceId:-}]"

management:
  # Actuator lives on its own port, reachable only inside the Docker network
  # (not published). The API port keeps /livez and /readyz for the proxy.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  metrics:
    tags:
      application: ritech-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    # The client's SMTP being down must not mark the API unhealthy (outbox retries instead)
    mail:
      enabled: false

# Contract for the frontend: /v3/api-docs(.yaml). API_DOCS_ENABLED=false hides it in production.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:true}

ritech:
  version: 0.7.0
  timezone: America/Bogota
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    max-failed-attempts: 5
    lock-duration: 15m
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
    require-https: ${REQUIRE_HTTPS:false}
  # Requests per minute; login/refresh per client IP
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    anonymous-per-minute: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:120}
    user-per-minute: ${RATE_LIMIT_USER_PER_MINUTE:300}
  simulation:
    min-capital: 100000
    currency: COP
  market:
    provider: ${MARKET_PROVIDER:fixed}
    symbol: QQQ
    alpha-vantage-api-key: ${ALPHAVANTAGE_API_KEY:}
    fixed-variation-pct: ${FIXED_VARIATION_PCT:1.0}
    cache-ttl: ${MARKET_CACHE_TTL:6h}
  calc-engine:
    base-url: ${CALC_ENGINE_URL:http://localhost:8000}
    timeout: 5s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    provider: ${AI_PROVIDER:template}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    timeout: 20s
    monthly-budget-usd: ${AI_MONTHLY_BUDGET_USD:5}
    input-price-per-mtok: ${AI_INPUT_PRICE_PER_MTOK:0}
    output-price-per-mtok: ${AI_OUTPUT_PRICE_PER_MTOK:0}
  news:
    provider: ${NEWS_PROVIDER:fixed}
    tickers: QQQ
    refresh-cron: ${NEWS_REFRESH_CRON:0 0 */6 * * *}
    max-daily-calls: ${NEWS_MAX_DAILY_CALLS:4}
    refresh-on-startup: ${NEWS_REFRESH_ON_STARTUP:true}
    alert-headlines: 5
    alert-window: 48h
  notifications:
    mail-from: ${MAIL_FROM:RiTech <no-reply@ritech.local>}
    max-attempts: 5
    retry-backoff: 1m
    dispatch-interval-ms: 30000
    default-variation-threshold-pct: ${NOTIFICATION_VARIATION_THRESHOLD_PCT:2.00}
  license:
    mode: ${LICENSE_MODE:disabled}
    file: ${LICENSE_FILE:/app/license/license.json}
    public-key-location: ${LICENSE_PUBLIC_KEY_LOCATION:classpath:license/public-key.pem}
    expiry-warning-days: 30
