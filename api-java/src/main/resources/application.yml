spring:
  application:
    name: ritech-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ritech}
    username: ${DATABASE_USER:ritech}
    password: ${DATABASE_PASSWORD:ritech}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ritech:
  version: 0.1.0
  simulation:
    min-capital: 100000
    currency: COP
  market:
    provider: ${MARKET_PROVIDER:fixed}
    symbol: QQQ
    alpha-vantage-api-key: ${ALPHAVANTAGE_API_KEY:}
    fixed-variation-pct: ${FIXED_VARIATION_PCT:1.0}
    cache-ttl: ${MARKET_CACHE_TTL:6h}
  calc-engine:
    base-url: ${CALC_ENGINE_URL:http://localhost:8000}
    timeout: 5s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
