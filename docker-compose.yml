# RiTech backend - one installation per client.
# Usage: cp .env.example .env && docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ritech}
      POSTGRES_USER: ${POSTGRES_USER:-ritech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ritech}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  calc-engine:
    build: ./calc-engine
    restart: unless-stopped
    # No published port: only reachable from the internal network.
    expose: ["8000"]
    networks: [internal]

  api:
    build: ./api-java
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      calc-engine:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ritech}
      DATABASE_USER: ${POSTGRES_USER:-ritech}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ritech}
      CALC_ENGINE_URL: http://calc-engine:8000
      MARKET_PROVIDER: ${MARKET_PROVIDER:-fixed}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      FIXED_VARIATION_PCT: ${FIXED_VARIATION_PCT:-1.0}
      MARKET_CACHE_TTL: ${MARKET_CACHE_TTL:-6h}
      AI_PROVIDER: ${AI_PROVIDER:-template}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-5}
      AI_INPUT_PRICE_PER_MTOK: ${AI_INPUT_PRICE_PER_MTOK:-0}
      AI_OUTPUT_PRICE_PER_MTOK: ${AI_OUTPUT_PRICE_PER_MTOK:-0}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-fixed}
      NEWS_REFRESH_CRON: ${NEWS_REFRESH_CRON:-0 0 */6 * * *}
      NEWS_MAX_DAILY_CALLS: ${NEWS_MAX_DAILY_CALLS:-4}
      NEWS_REFRESH_ON_STARTUP: ${NEWS_REFRESH_ON_STARTUP:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (at least 32 characters)}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      # JSON logs (Elastic Common Schema), one line per event, with traceId
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_NAME: ritech-api
    ports:
      - "${API_PORT:-8080}:8080"
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
