name: Release

# Pushing a tag vX.Y.Z publishes versioned images to GitHub Container Registry:
#   ghcr.io/<owner>/ritech-api:X.Y.Z and ghcr.io/<owner>/ritech-calc-engine:X.Y.Z
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # GitHub Release with openapi.yaml
  packages: write

jobs:
  # Versioned API contract for the frontend repository: openapi.yaml attached to the release
  openapi:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: release-only-secret-release-only-secret-0
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: curl -fsS http://localhost:8080/v3/api-docs.yaml -o openapi.yaml
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" openapi.yaml --clobber
      - if: always()
        run: docker compose down -v

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ritech-api
            context: ./api-java
          - name: ritech-calc-engine
            context: ./calc-engine
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
